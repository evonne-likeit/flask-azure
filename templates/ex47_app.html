<!DOCTYPE html>
<html>
<head>
    <title>Exercise 47 - App Info</title>
</head>
<body>
    <h1>Exercise 47: Template - Page</h1>
    <h2>{{text}}</h2>
    {% if appInfo != undefined %}
    <h2>AppInfo : </h2>
    <p>id : {{appInfo.id}}</p>
    <p>name : {{appInfo.name}}</p>
    <p>version : {{appInfo.version}}</p>
    <p>author : {{appInfo.author}}</p>
    <p>remark : {{appInfo.remark}}</p>
    {% endif %}
</body>
</html>
